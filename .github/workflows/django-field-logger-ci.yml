# Runs the test suite with tox on every supported Python version, and against
# database servers. Linting runs on pre-commit.ci.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: fieldlogger CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # tox builds the package and installs the test dependencies itself.
      - name: Install tox
        run: python -m pip install --upgrade pip tox

      # -f selects every env of the matrix with this python factor;
      # -e would create an ad-hoc env without any Django pin.
      - name: Run tox
        run: tox -q -f py$(echo ${{ matrix.python-version }} | tr -d .)

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The suite against database servers. Their tox envs are not in
  # env_list; `tox -m <backend>` selects them.
  servers:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            image: postgres:16
            port: 5432
            health: pg_isready
          - backend: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -ptest
          - backend: mariadb
            image: mariadb:11
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
          - backend: oracle
            image: gvenzl/oracle-free:23-slim-faststart
            port: 1521
            health: healthcheck.sh

    services:
      db:
        image: ${{ matrix.image }}
        # Every image reads only its own variable.
        env:
          POSTGRES_PASSWORD: test
          MYSQL_ROOT_PASSWORD: test
          MARIADB_ROOT_PASSWORD: test
          ORACLE_PASSWORD: test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      DB_HOST: localhost
      DB_PORT: ${{ matrix.port }}
      DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run tox
        run: tox -q -m ${{ matrix.backend }}
