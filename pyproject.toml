[build-system]
# 77.0.3: first release with full support for SPDX license expressions.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-field-logger"
version = "0.7.1"
description = "A Django app for logging changes in model fields."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
keywords = ["django", "audit", "audit-log", "history", "changes", "field", "logging"]
authors = [
    {name = "Sergio Rodríguez", email = "srodriguez3441@gmail.com"},
]
maintainers = [
    {name = "Sergio Rodríguez", email = "srodriguez3441@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    # FieldLoggerMiddleware uses iscoroutinefunction/markcoroutinefunction,
    # added in asgiref 3.6; Django 4.2+ already requires it.
    "asgiref>=3.6",
    "Django>=4.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "build",
    "Pillow",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "ruff",
    "tox",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Nibblex/django-field-logger"
Source = "https://github.com/Nibblex/django-field-logger"
Issues = "https://github.com/Nibblex/django-field-logger/issues"
Changelog = "https://github.com/Nibblex/django-field-logger/releases"

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
# The repo root, so tests.settings and this checkout of fieldlogger (not the
# copy tox installs) are imported.
pythonpath = ["."]
# Deprecations triggered by our own code (library or tests) fail the run;
# those of third-party code are not ours to fix.
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::DeprecationWarning:fieldlogger",
    "error::DeprecationWarning:tests",
]

[tool.coverage.run]
source = ["fieldlogger"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py{314,313,312}-django{61,60}
           py{314,313,312,311,310}-django{52,51,50}
           py{313,312,311,310}-django{42,41}
           py310-django40
# Envs for other database servers need a running server (DB_* variables,
# see tests/settings.py), so they are not in env_list: run them with
# `tox -m <backend>` (postgres, mysql, mariadb, oracle) or `tox -m servers`.
labels =
    postgres = postgres-django{61,52,42}
    mysql = mysql-django{61,52,42}
    mariadb = mariadb-django{61,52,42}
    # Django supports oracledb (no Oracle client libraries) from 5.0.
    oracle = oracle-django{61,52}
    servers = {postgres,mysql,mariadb}-django{61,52,42}, oracle-django{61,52}

[testenv]
deps =
    Pillow
    pytest
    pytest-cov
    pytest-django
    django61: Django>=6.1,<6.2
    django60: Django>=6.0,<6.1
    django52: Django>=5.2,<5.3
    django51: Django>=5.1,<5.2
    django50: Django>=5.0,<5.1
    django42: Django>=4.2,<4.3
    django41: Django>=4.1,<4.2
    django40: Django>=4.0,<4.1
    postgres: psycopg[binary]
    mysql,mariadb: PyMySQL
    oracle: oracledb
base_python =
    postgres,mysql,mariadb,oracle: python3.13
set_env =
    postgres: TEST_DB = postgres
    mysql: TEST_DB = mysql
    mariadb: TEST_DB = mariadb
    oracle: TEST_DB = oracle
    # The 100% coverage gate is enforced by the SQLite matrix; some paths
    # cannot run on every backend (e.g. ignore_conflicts on Oracle).
    postgres,mysql,mariadb,oracle: PYTEST_ADDOPTS = --cov-fail-under=0
pass_env =
    DB_HOST
    DB_PORT
    DB_USER
    DB_PASSWORD
    DB_NAME

commands = pytest -q --cov --cov-report=xml
allowlist_externals = pytest
"""

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "B", "UP",
    # With UP, what the pyupgrade hook used to fix.
    "C401", "C402", "C403", "C404", "C405", "W605",
]
